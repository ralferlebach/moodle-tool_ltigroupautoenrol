name: Moodle Plugin CI

on: [push, pull_request]

# Gate policy (see README, section "Quality gates"):
# - Hard gates (fail the build): phplint, codechecker, phpdoc, validate, savepoints, mustache,
#   grunt, PHPUnit (incl. upgrade-path tests against the historical schemas), Behat (incl. axe
#   accessibility checks) on every supported Moodle branch with PostgreSQL and MariaDB.
# - Advisory: phpcpd/phpmd (heuristics, deprecated in moodle-plugin-ci 4) and the moving
#   Moodle "main" branch, which is not a declared supported version.

jobs:
  test:
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.experimental }}

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      # Declared support: version.php $plugin->supported = [405, 502].
      matrix:
        include:
          # Moodle 4.5 LTS (lower bound): PHP 8.1 - 8.3.
          - {php: '8.1', moodle-branch: MOODLE_405_STABLE, database: pgsql, pg: '16', experimental: false}
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: pgsql, pg: '16', experimental: false}
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: mariadb, pg: '16', experimental: false}
          # Moodle 5.0: PHP 8.2 - 8.4.
          - {php: '8.4', moodle-branch: MOODLE_500_STABLE, database: pgsql, pg: '16', experimental: false}
          - {php: '8.4', moodle-branch: MOODLE_500_STABLE, database: mariadb, pg: '16', experimental: false}
          # Moodle 5.1: PHP 8.2 - 8.4.
          - {php: '8.4', moodle-branch: MOODLE_501_STABLE, database: pgsql, pg: '16', experimental: false}
          - {php: '8.4', moodle-branch: MOODLE_501_STABLE, database: mariadb, pg: '16', experimental: false}
          # Moodle 5.2 (upper bound): PHP 8.3 - 8.4 (composer requires php >= 8.3).
          - {php: '8.3', moodle-branch: MOODLE_502_STABLE, database: pgsql, pg: '16', experimental: false}
          - {php: '8.4', moodle-branch: MOODLE_502_STABLE, database: pgsql, pg: '16', experimental: false}
          - {php: '8.4', moodle-branch: MOODLE_502_STABLE, database: mariadb, pg: '16', experimental: false}
          # Early warning only, not a supported version; main requires PostgreSQL 17.
          - {php: '8.4', moodle-branch: main, database: pgsql, pg: '17', experimental: true}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          # Install nvm v0.39.7 (temp workaround for issue moodlehq/moodle-plugin-ci#309).
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          MUSTACHE_IGNORE_NAMES: ''

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector (advisory)
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector (advisory)
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests (incl. upgrade path from 0.1 and 1.1 schemas)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning --fail-on-risky --fail-on-skipped --testdox

      - name: Behat features (incl. accessibility)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

  release-package:
    # Builds the installable ZIP exactly as "git archive" produces it and records its identity.
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          version=$(sed -n 's/.*\$plugin->version *= *\([0-9]*\).*/\1/p' version.php)
          name="tool_ltigroupautoenrol_${version}_${GITHUB_SHA::12}.zip"
          git archive --format=zip --prefix=ltigroupautoenrol/ -o "$name" HEAD
          echo "ZIP=$name" >> "$GITHUB_ENV"

      - name: Check ZIP contents
        run: |
          unzip -Z1 "$ZIP" > contents.txt
          cat contents.txt
          # Development-only files must not be shipped.
          if grep -E '^ltigroupautoenrol/(\.github/|\.gitattributes|\.gitignore|node_modules/|vendor/)|\.DS_Store' contents.txt; then
            echo "::error::Release ZIP contains development files"; exit 1
          fi
          for f in version.php LICENSE README.md CHANGES.md db/install.xml db/access.php lang/en/tool_ltigroupautoenrol.php; do
            grep -qx "ltigroupautoenrol/$f" contents.txt || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Release evidence
        run: |
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          {
            echo "### Release evidence"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- ZIP: \`$ZIP\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$ZIP.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tool_ltigroupautoenrol-${{ github.sha }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
