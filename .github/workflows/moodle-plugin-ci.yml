name: Moodle Plugin CI

on: [push, pull_request]

# Gate policy:
# - Hard gates (fail the build): phplint, codechecker, phpdoc, validate, savepoints, mustache,
#   grunt, PHPUnit (incl. upgrade-path tests against the historical schemas), Behat (incl. axe
#   accessibility checks) on every supported Moodle branch with PostgreSQL and MariaDB.
# - Advisory: phpcpd/phpmd (heuristics, deprecated in moodle-plugin-ci 4).
# Every supported Moodle branch is a hard gate; the database images follow each branch's
# minimum versions (Moodle 5.3: PostgreSQL 17, MariaDB 11.4).

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          # MariaDB 11 images no longer ship mysqladmin; healthcheck.sh exists in all supported images.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10

    strategy:
      fail-fast: false
      # Declared support: version.php $plugin->supported = [405, 503].
      matrix:
        include:
          # Moodle 4.5 LTS (lower bound): PHP 8.1 - 8.3.
          - {php: '8.1', moodle-branch: MOODLE_405_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: mariadb, pg: '16', mariadb: '10.11'}
          # Moodle 5.0: PHP 8.2 - 8.4.
          - {php: '8.4', moodle-branch: MOODLE_500_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.4', moodle-branch: MOODLE_500_STABLE, database: mariadb, pg: '16', mariadb: '10.11'}
          # Moodle 5.1: PHP 8.2 - 8.4.
          - {php: '8.4', moodle-branch: MOODLE_501_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.4', moodle-branch: MOODLE_501_STABLE, database: mariadb, pg: '16', mariadb: '10.11'}
          # Moodle 5.2: PHP 8.3 - 8.4.
          - {php: '8.3', moodle-branch: MOODLE_502_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.4', moodle-branch: MOODLE_502_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.4', moodle-branch: MOODLE_502_STABLE, database: mariadb, pg: '16', mariadb: '10.11'}
          # Moodle 5.3 (upper bound): PHP 8.3 - 8.4, PostgreSQL >= 17, MariaDB >= 11.4.
          - {php: '8.3', moodle-branch: MOODLE_503_STABLE, database: pgsql, pg: '17', mariadb: '11.4'}
          - {php: '8.4', moodle-branch: MOODLE_503_STABLE, database: pgsql, pg: '17', mariadb: '11.4'}
          - {php: '8.4', moodle-branch: MOODLE_503_STABLE, database: mariadb, pg: '17', mariadb: '11.4'}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          # Install nvm v0.39.7 (temp workaround for issue moodlehq/moodle-plugin-ci#309).
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          MUSTACHE_IGNORE_NAMES: ''

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector (advisory)
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcpd

      - name: PHP Mess Detector (advisory)
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests (incl. upgrade from the 0.1, 1.0.1, 1.1 and 1.2 pre-release schemas)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning --fail-on-risky --fail-on-skipped --testdox

      - name: Behat features (incl. accessibility)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

  upgrade-e2e:
    # Real site upgrade from the published 1.0.1 (identical to git fd456f3) following docs/CHANGES.md:
    # install 1.0.1, store duplicate and orphaned configurations, run the read-only check, upgrade, then
    # require "Database structure is ok." and the expected data and backups (tests/upgrade/upgrade_e2e.sh).
    # The code upgraded to is exactly the candidate ZIP of release-artefact (SHA-256 checked), not the checkout.
    needs: release-artefact
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: pgsql, pg: '16', mariadb: '10.11'}
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: mariadb, pg: '16', mariadb: '10.11'}
          - {php: '8.4', moodle-branch: MOODLE_503_STABLE, database: pgsql, pg: '17', mariadb: '11.4'}
          - {php: '8.4', moodle-branch: MOODLE_503_STABLE, database: mariadb, pg: '17', mariadb: '11.4'}

    steps:
      - name: Check out repository code (full history for the 1.0.1 baseline)
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, intl, zip, soap, mbstring, curl, xml, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Check out Moodle
        run: |
          git clone --depth 1 --branch "${{ matrix.moodle-branch }}" https://github.com/moodle/moodle.git moodle
          # Since Moodle 5.1, third-party libraries come from Composer.
          cd moodle && composer install --no-interaction --no-dev --no-progress

      - name: Create empty database and config.php
        run: |
          if [ "${{ matrix.database }}" = pgsql ]; then
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE moodle ENCODING 'UTF8' TEMPLATE template0;"
            dbuser=postgres; dbport=5432; extra=""
          else
            mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE moodle DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            dbuser=root; dbport=3306; extra=", 'dbcollation' => 'utf8mb4_unicode_ci'"
          fi
          mkdir -p /tmp/moodledata
          cat > moodle/config.php <<EOF
          <?php
          unset(\$CFG); global \$CFG; \$CFG = new stdClass();
          \$CFG->dbtype = '${{ matrix.database }}'; \$CFG->dblibrary = 'native'; \$CFG->dbhost = '127.0.0.1';
          \$CFG->dbname = 'moodle'; \$CFG->dbuser = '$dbuser'; \$CFG->dbpass = ''; \$CFG->prefix = 'mdl_';
          \$CFG->dboptions = ['dbport' => $dbport$extra];
          \$CFG->wwwroot = 'http://127.0.0.1'; \$CFG->dataroot = '/tmp/moodledata';
          \$CFG->admin = 'admin'; \$CFG->directorypermissions = 0777;
          require_once(__DIR__ . '/lib/setup.php');
          EOF
          sed -i 's/^          //' moodle/config.php
          php -l moodle/config.php

      - name: Download and unpack the candidate ZIP
        uses: actions/download-artifact@v4
        with:
          name: candidate-tool_ltigroupautoenrol-${{ github.sha }}
          path: release

      - name: Verify the ZIP bytes and unpack them
        run: |
          test "$(sha256sum 'release/${{ needs.release-artefact.outputs.zip }}' | cut -d' ' -f1)" = '${{ needs.release-artefact.outputs.sha256 }}'
          mkdir -p zipcode
          unzip -q "release/${{ needs.release-artefact.outputs.zip }}" -d zipcode
          test -f zipcode/ltigroupautoenrol/version.php

      - name: Upgrade from the published 1.0.1 to the candidate ZIP
        run: bash plugin/tests/upgrade/upgrade_e2e.sh moodle plugin zipcode/ltigroupautoenrol

  playwright:
    # Browser tests (page identity, axe WCAG 2.1 A/AA, keyboard and focus, reflow, German UI, access denial)
    # on the lower and upper supported branch. Part of this workflow so that the release gate depends on it.
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 4.5: classic layout, web root = Moodle root.
          - {moodle-branch: MOODLE_405_STABLE, php: '8.3', pg: '16', langpack: '4.5', plugin-path: admin/tool/ltigroupautoenrol, webroot: moodle}
          # Moodle 5.3: public/ layout (since 5.1), PostgreSQL >= 17.
          - {moodle-branch: MOODLE_503_STABLE, php: '8.4', pg: '17', langpack: '5.3', plugin-path: public/admin/tool/ltigroupautoenrol, webroot: moodle/public}

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      MOODLE_WWWROOT: http://127.0.0.1:8000
      PLUGIN_PATH: ${{ matrix.plugin-path }}
      MOODLE_WEBROOT: ${{ matrix.webroot }}
      LANGPACK: ${{ matrix.langpack }}

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out Moodle and install the plugin
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" https://github.com/moodle/moodle.git moodle
          mkdir -p "$(dirname "moodle/$PLUGIN_PATH")"
          cp -a plugin "moodle/$PLUGIN_PATH"
          rm -rf "moodle/$PLUGIN_PATH/.git"
          # Since Moodle 5.1, third-party libraries (Guzzle, Slim, Mustache, ...) come from Composer.
          cd moodle && composer install --no-interaction --no-dev --no-progress

      - name: Install Moodle site with the German language pack
        run: |
          mkdir -p /tmp/moodledata/lang
          curl -sSL -o /tmp/de.zip https://download.moodle.org/download.php/direct/langpack/$LANGPACK/de.zip
          unzip -q /tmp/de.zip -d /tmp/moodledata/lang
          cd moodle
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="CI" --shortname="CI" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid

      - name: Seed fixture
        run: |
          cd moodle
          php "$PLUGIN_PATH/tests/playwright/seed.php" > /tmp/ltigae-seed.env
          sed -n "s/^export \([A-Z_][A-Z_]*\)='\(.*\)'$/\1=\2/p" /tmp/ltigae-seed.env >> "$GITHUB_ENV"

      - name: Install Playwright and browser
        run: |
          cd "moodle/$PLUGIN_PATH/tests/playwright"
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd "moodle/$PLUGIN_PATH/tests/playwright"
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t "$GITHUB_WORKSPACE/$MOODLE_WEBROOT" \
            >/tmp/moodle-server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:8000/login/index.php || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "Moodle not reachable (HTTP $code)"; tail -50 /tmp/moodle-server.log; exit 1; }
          npm test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.moodle-branch }}-${{ github.sha }}
          path: moodle/${{ env.PLUGIN_PATH }}/tests/playwright/playwright-report
          retention-days: 14

  release-artefact:
    name: Release artefact contents
    # As in ralferlebach/moodle-plugintemplate: the gate checks the file set that is actually shipped
    # (git archive honours the export-ignore rules of .gitattributes), not the working tree.
    # It also builds the installable ZIP from the same commit; the installation smoke test installs exactly these bytes.
    runs-on: ubuntu-22.04
    outputs:
      zip: ${{ steps.zip.outputs.zip }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Build the release archive exactly as it will be distributed
        run: |
          git archive --format=tar --prefix=ltigroupautoenrol/ HEAD > /tmp/release.tar
          tar -tf /tmp/release.tar > /tmp/release.list
          echo "Artefakt enthält $(wc -l < /tmp/release.list) Einträge."

      - name: No developer tooling, CI plumbing or test harnesses may ship
        run: |
          rc=0
          while read -r forbidden; do
            if grep -qE "^ltigroupautoenrol/${forbidden}" /tmp/release.list; then
              echo "VERBOTEN im Release-Artefakt: $forbidden"
              grep -E "^ltigroupautoenrol/${forbidden}" /tmp/release.list | head -5
              rc=1
            fi
          done <<'PATTERNS'
          tools/
          \.github/
          tests/load/
          tests/playwright/
          tests/upgrade/
          \.gitattributes
          \.gitignore
          makefile
          phpcs\.xml
          PATTERNS
          # docs/ is internal documentation, except the change log the README links to.
          if grep -E "^ltigroupautoenrol/docs/." /tmp/release.list | grep -vx "ltigroupautoenrol/docs/CHANGES.md"; then
            echo "VERBOTEN im Release-Artefakt: interne Dokumentation unter docs/"
            rc=1
          fi
          if [[ $rc -ne 0 ]]; then
            echo "Das Release-Artefakt darf keine Entwicklerwerkzeuge enthalten."
            exit 1
          fi
          echo "Artefakt ist sauber."

      - name: The artefact must still contain what Moodle runs
        run: |
          for required in ltigroupautoenrol/version.php ltigroupautoenrol/lang ltigroupautoenrol/db \
              ltigroupautoenrol/classes ltigroupautoenrol/backup ltigroupautoenrol/lib.php \
              ltigroupautoenrol/docs/CHANGES.md ltigroupautoenrol/README.md ltigroupautoenrol/LICENSE; do
            if ! grep -q "^${required}" /tmp/release.list; then
              echo "FEHLT im Release-Artefakt: $required"
              exit 1
            fi
          done
          echo "Pflichtinhalte vorhanden."

      - name: Build the installable ZIP from the same commit
        id: zip
        run: |
          version=$(grep -oE '\$plugin->version[[:space:]]*=[[:space:]]*[0-9]+' version.php | grep -oE '[0-9]+$')
          zip="tool_ltigroupautoenrol-${version}.zip"
          git archive --format=zip --prefix=ltigroupautoenrol/ -o "$zip" HEAD
          # Same file set as the checked TAR archive.
          unzip -Z1 "$zip" | grep -v '/$' | sort > /tmp/zip.list
          grep -v '/$' /tmp/release.list | sort > /tmp/tar.list
          diff /tmp/tar.list /tmp/zip.list
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          echo "$sha  $zip" > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "ZIP $zip, SHA-256 $sha, commit $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate ZIP (released only by the release gate)
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tool_ltigroupautoenrol-${{ github.sha }}
          path: |
            ${{ steps.zip.outputs.zip }}
            ${{ steps.zip.outputs.zip }}.sha256

  install-smoke:
    name: "Installation smoke test / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    # Installs exactly the ZIP built by release-artefact (SHA-256 checked) on a fresh site and runs the production
    # path once with .github/scripts/install_smoke.php. A negative check proves that the smoke test notices a
    # runtime file missing from the package.
    needs: release-artefact
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', moodle-branch: MOODLE_405_STABLE, database: pgsql, pg: '16', mariadb: '10.11', plugin-path: admin/tool}
          - {php: '8.4', moodle-branch: MOODLE_503_STABLE, database: mariadb, pg: '17', mariadb: '11.4', plugin-path: public/admin/tool}

    steps:
      - name: Check out repository code (smoke script only; the plugin comes from the ZIP)
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Download the candidate ZIP
        uses: actions/download-artifact@v4
        with:
          name: candidate-tool_ltigroupautoenrol-${{ github.sha }}
          path: release

      - name: Verify the ZIP bytes
        run: |
          cd release
          ls -l
          test "$(sha256sum '${{ needs.release-artefact.outputs.zip }}' | cut -d' ' -f1)" = '${{ needs.release-artefact.outputs.sha256 }}'
          echo "SHA-256 matches release-artefact: ${{ needs.release-artefact.outputs.sha256 }}"

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, intl, zip, soap, mbstring, curl, xml, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Check out Moodle and unpack the ZIP into it
        run: |
          git clone --depth 1 --branch "${{ matrix.moodle-branch }}" https://github.com/moodle/moodle.git moodle
          # Since Moodle 5.1, third-party libraries come from Composer.
          (cd moodle && composer install --no-interaction --no-dev --no-progress)
          mkdir -p "moodle/${{ matrix.plugin-path }}"
          unzip -q "release/${{ needs.release-artefact.outputs.zip }}" -d "moodle/${{ matrix.plugin-path }}"
          test -f "moodle/${{ matrix.plugin-path }}/ltigroupautoenrol/version.php"

      - name: Install a fresh site with the plugin
        run: |
          if [ "${{ matrix.database }}" = pgsql ]; then
            psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE moodle ENCODING 'UTF8' TEMPLATE template0;"
            dbuser=postgres; dbport=5432
          else
            mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE moodle DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            dbuser=root; dbport=3306
          fi
          cd moodle
          php admin/cli/install.php --non-interactive --agree-license \
            --dbtype=${{ matrix.database }} --dbhost=127.0.0.1 --dbport=$dbport --dbname=moodle --dbuser=$dbuser --dbpass= \
            --wwwroot=http://127.0.0.1 --dataroot=/tmp/moodledata \
            --fullname=Smoke --shortname=Smoke --adminpass='Admin!23' --adminemail=admin@example.invalid > /tmp/install.log 2>&1 \
            || { tail -n 40 /tmp/install.log; exit 1; }
          php admin/cli/check_database_schema.php | tee /tmp/schema.log
          grep -qx "Database structure is ok." /tmp/schema.log

      - name: Installation smoke test of the installed ZIP
        run: php plugin/.github/scripts/install_smoke.php "$PWD/moodle" "$PWD/moodle/${{ matrix.plugin-path }}/ltigroupautoenrol"

      - name: Negative check - a runtime file missing from the package is detected
        run: |
          rm "moodle/${{ matrix.plugin-path }}/ltigroupautoenrol/classes/local/mapping.php"
          php moodle/admin/cli/purge_caches.php
          if php plugin/.github/scripts/install_smoke.php "$PWD/moodle" "$PWD/moodle/${{ matrix.plugin-path }}/ltigroupautoenrol"; then
            echo "::error::The installation smoke test did not notice a missing runtime file"
            exit 1
          fi
          echo "Missing runtime file detected as expected."

  gate-selftest:
    name: Release gate self-test
    # Fail-closed proof of the gate logic (.github/scripts/release_gate.sh): every result other than "success",
    # a missing result and an empty list must fail the gate; only all-green passes.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Gate logic fails closed
        run: |
          gate=.github/scripts/release_gate.sh
          expect() {
            local want=$1; shift
            if bash "$gate" "$@" > /dev/null; then got=pass; else got=fail; fi
            echo "$want <- $got: $*"
            [ "$want" = "$got" ]
          }
          expect pass test=success playwright=success
          expect fail test=success playwright=failure
          expect fail test=success playwright=cancelled
          expect fail test=success playwright=skipped
          expect fail test=success playwright=
          expect fail test=success playwright
          expect fail

  maturity-gate:
    name: Release gate
    # Single place where the release gates are judged; Playwright is one of them (audit A-01). Only if every
    # gate is green, the candidate ZIP is published as the release artifact of the run.
    needs: [test, upgrade-e2e, playwright, release-artefact, install-smoke, gate-selftest]
    runs-on: ubuntu-22.04
    # Without always() this job is skipped when a dependency fails, and a skipped job is not re-run by
    # "re-run failed jobs".
    if: always()
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Every release gate must be green
        run: |
          bash .github/scripts/release_gate.sh \
            "test=${{ needs.test.result }}" \
            "upgrade-e2e=${{ needs.upgrade-e2e.result }}" \
            "playwright=${{ needs.playwright.result }}" \
            "release-artefact=${{ needs.release-artefact.result }}" \
            "install-smoke=${{ needs.install-smoke.result }}" \
            "gate-selftest=${{ needs.gate-selftest.result }}"
          maturity=$(grep -oE 'MATURITY_[A-Z]+' version.php | head -1)
          echo "Deklarierter Reifegrad: ${maturity:-unbekannt}"

      - name: Download the candidate ZIP
        uses: actions/download-artifact@v4
        with:
          name: candidate-tool_ltigroupautoenrol-${{ github.sha }}
          path: release

      - name: Check the candidate bytes once more
        run: |
          test "$(sha256sum 'release/${{ needs.release-artefact.outputs.zip }}' | cut -d' ' -f1)" = '${{ needs.release-artefact.outputs.sha256 }}'
          {
            echo "### Release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- ZIP: \`${{ needs.release-artefact.outputs.zip }}\`"
            echo "- SHA-256: \`${{ needs.release-artefact.outputs.sha256 }}\`"
            echo "- All gates green; published as artifact tool_ltigroupautoenrol-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the released ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tool_ltigroupautoenrol-${{ github.sha }}
          path: release/

  ci-complete:
    name: CI complete
    needs: [maturity-gate]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: All gates must have succeeded
        run: bash .github/scripts/release_gate.sh "maturity-gate=${{ needs.maturity-gate.result }}"
